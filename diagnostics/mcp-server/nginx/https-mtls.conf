events {
    worker_connections 1024;
}

http {
    upstream mcp_backend {
        server mcp-server:8000;
    }

    upstream opa_backend {
        server opa:8181;
    }

    log_format cert_debug '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent '
                          'SSL_VERIFY: $ssl_client_verify '
                          'SSL_DN: $ssl_client_s_dn '
                          'SSL_ISSUER: $ssl_client_i_dn '
                          'CONTENT_TYPE: $http_content_type '
                          'CONTENT_LENGTH: $http_content_length '
                          'OPA_AUTH: $upstream_http_x_opa_authz_allow';

    server {
        listen 8443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/server-cert.pem;
        ssl_certificate_key /etc/nginx/certs/server-key.pem;
        ssl_client_certificate /etc/nginx/certs/ca-cert.pem;
        ssl_verify_client optional;
        ssl_verify_depth 2;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        access_log /var/log/nginx/access.log cert_debug;
        error_log /var/log/nginx/error.log info;

        # Internal location for OPA authorization
        location = /opa/authz {
            internal;
            proxy_pass http://opa_backend/v1/data/diagnostic_tools/allow;
            proxy_method POST;
            proxy_set_header Content-Type application/json;

            # Build OPA input payload with client_id from cert (full DN)
            proxy_set_body '{"input":{"client_id":"$ssl_client_s_dn","method":"$request_method","path":"$request_uri","ssl_verify":"$ssl_client_verify"}}';

            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        location /mcp {
            # OPA Authorization check
            auth_request /opa/authz;
            auth_request_set $auth_status $upstream_status;

            # If OPA denies (returns non-200), return 403
            error_page 403 = @opa_denied;

            proxy_pass http://mcp_backend/mcp;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Content-Length $http_content_length;

            proxy_request_buffering off;
            proxy_buffering off;

            proxy_set_header Accept $http_accept;
            proxy_set_header User-Agent $http_user_agent;

            # Pass client certificate DN to backend
            proxy_set_header X-Client-DN $ssl_client_s_dn;
            proxy_set_header X-Client-Verify $ssl_client_verify;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /health {
            # Health check bypasses OPA authorization
            proxy_pass http://mcp_backend/health;
            proxy_set_header Host $host;
        }

        location @opa_denied {
            default_type application/json;
            return 403 '{"error":"OPA authorization denied","client_dn":"$ssl_client_s_dn","path":"$request_uri"}';
        }
    }
}

