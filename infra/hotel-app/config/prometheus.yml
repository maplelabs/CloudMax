global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Nginx basic metrics
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
    scrape_interval: 30s
    metrics_path: '/metrics'

  # Nginx HTTP status codes from logs
  - job_name: 'nginx-logs'
    static_configs:
      - targets: ['nginx-log-exporter:4040']
    scrape_interval: 30s
    metrics_path: '/metrics'

  # Kafka metrics
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']
    scrape_interval: 30s
    metrics_path: '/metrics'

  # Container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s
    metrics_path: '/metrics'

  # PostgreSQL metrics
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s
    metrics_path: '/metrics'


