apiVersion: 1

datasources:
  - name: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    # Fixed uid so file-provisioned alert rules (see ./alerting/rules.yml)
    # can reference this datasource by a known value instead of looking it
    # up at runtime -- Grafana would otherwise generate a random uid.
    uid: prometheus-ds
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      maxLines: 1000
