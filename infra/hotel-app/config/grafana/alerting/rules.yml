# Every rule below carries `labels: {severity: P1}`. CloudMax's webhook
# ingestion (core/backend/src/server/apis_v1/webhooks.py,
# map_severity_to_standard()) defaults ANY alert with no `severity` label
# to P3, and AppConfig.enabled_severities defaults to {P1} only -- so
# without this label, every alert from this file was being accepted and
# stored (visible in the UI), but silently excluded from automatic
# triage (no alert_groups/triages row ever created). Confirmed live: a
# fired search-service-high-memory-usage alert sat untriaged with
# severity=P3 until this label was added. P1 is used uniformly here so
# this demo's automated-triage pipeline actually exercises end-to-end
# for every fault type, matching AppConfig's default enabled_severities.
#
# File-provisioned Grafana alert rule(s) for the hotel reservation app.
# Auto-created in the "Hotel Reservation Alerts" folder (Grafana creates
# the folder itself if it doesn't already exist) on every Grafana startup
# -- no runtime API calls or manual UI setup needed.
#
# References the prometheus datasource by its fixed uid (see
# ../datasource.yml) and the cloudmax-webhook contact point (see
# ./contactpoints.yml / ./policies.yml) for where alerts get routed.
apiVersion: 1

# NOTE on editing/pausing these rules via the Grafana UI: Grafana locks ANY
# rule loaded from this file as provenance=file, and (confirmed live + see
# https://github.com/grafana/grafana/issues/103597) there is currently NO
# supported way to unlock a file-provisioned rule for UI edits -- not via
# the UI, not via the provisioning API's X-Disable-Provenance header (that
# only applies when CREATING a brand-new API-provisioned rule; attempting
# it on an existing file-provisioned rule fails with HTTP 409
# provenanceMismatch, confirmed live against this exact file's rules). A
# top-level `disableProvenance: true` key here was tried and does nothing
# (also confirmed live -- provenance stayed 'file' after a redeploy).
# The ONLY supported way to change isPaused (or anything else) on these
# rules is to edit this file and redeploy Grafana -- see each rule's
# isPaused field below (nginx-error, high-api-failure, and
# nginx-high-http-error-count are currently paused this way).

# hotel-app-alerts group (previously containing only nginx-5xx-high /
# "Nginx HTTP 5xx Errors High") removed at user's request -- not required.
# deleteRules below tells Grafana to actually remove the already-provisioned
# rule from this (and any other) instance; simply omitting it from `groups`
# would NOT delete it -- Grafana only reconciles rules it's explicitly told
# to add/update/delete, so an omitted-but-previously-applied file rule would
# otherwise be silently orphaned (still present, still evaluating, just no
# longer tracked by this file).
deleteRules:
  - orgId: 1
    uid: nginx-5xx-high

groups:
  # --- Second group: broader fault-detection coverage previously
  # configured by hand in the live Grafana UI (exported as
  # alert-rules.yaml at the repo root, which is a raw Grafana export --
  # not usable directly, since it embeds a live instance's
  # auto-generated datasource uid (P1809F7CD0C75ACF3), per-rule UI-only
  # fields, and non-standalone classic-condition syntax). Re-authored
  # here as plain file-provisioning input: same PromQL expressions and
  # thresholds, repointed at our fixed prometheus-ds uid, trimmed to
  # only the fields provisioning actually needs, and routed through the
  # same cloudmax-webhook contact point. isPaused is preserved exactly
  # as it was left in the live instance (3 of these were intentionally
  # paused -- likely superseded/being iterated on alongside the
  # nginx-5xx-high rule above).
  - orgId: 1
    name: hotel-reservation-application-alerts
    folder: Hotel Reservation Application
    interval: 1m
    rules:
      - uid: docker-container-restart
        title: 'docker container restart'
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          severity: P1
        notification_settings:
          receiver: cloudmax-webhook
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              expr: 'resets(container_cpu_usage_seconds_total{container_label_com_docker_compose_service=~"zookeeper|kafka|postgres|elasticsearch|frontend|nodejs-bff|search-service|booking-service|booking-post-processing-service|invoice-service",cpu="total"}[5m])'
              instant: true
              range: false
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0

      - uid: search-service-rapid-memory-growth
        title: search service rapid memory growth
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          severity: P1
        notification_settings:
          receiver: cloudmax-webhook
        data:
          # container_memory_usage_bytes is a GAUGE (confirmed live:
          # `# TYPE container_memory_usage_bytes gauge` from cAdvisor's own
          # /metrics output), not a counter. rate() assumes a monotonically
          # increasing counter and treats any decrease as a "reset" --
          # applying it to a gauge produces meaningless/misleading values
          # whenever memory usage drops at all between scrapes. deriv()
          # is the correct PromQL function for a gauge's per-second rate of
          # change (linear regression over the range, handles decreases
          # correctly instead of misinterpreting them as counter resets).
          #
          # Window shrunk 5m -> 1m: confirmed live against a real
          # fault_memory_stress_search_service injection that a genuine
          # ~26.5 MiB jump occurring in under 15s was diluted by deriv()'s
          # linear regression across a full 5-minute window (mostly flat
          # baseline on both sides of the brief spike) down to only
          # ~117,870 B/s -- far under the 700,000 B/s threshold despite the
          # instantaneous rate during the spike itself being ~1.9M B/s. A
          # 1-minute window keeps enough flat baseline for stability but no
          # longer buries a burst this short.
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              expr: 'deriv(container_memory_usage_bytes{container_label_com_docker_compose_service="search-service"}[1m])'
              instant: true
              range: false
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 700000

      - uid: search-service-high-memory-usage
        title: search service high memory usage
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          severity: P1
        notification_settings:
          receiver: cloudmax-webhook
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              expr: 'container_memory_usage_bytes{container_label_com_docker_compose_service="search-service"}'
              instant: true
              range: false
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                # History: raised 100 MiB (104857600) -> 150 MiB
                # (157286400) to stop permanently tripping on normal
                # steady-state usage (~109-114 MiB baseline). Then lowered
                # back down to 125 MiB (131072000) -- confirmed live that a
                # real fault_memory_stress_search_service injection only
                # peaked at 135.3 MiB (container was restarted before
                # reaching the fault's full documented ~400MB footprint),
                # which the 150 MiB threshold missed entirely. 125 MiB
                # splits the difference: still above the ~109-114 MiB normal
                # baseline (no false positives), but low enough to catch
                # this fault's actual real-world magnitude.
                - evaluator:
                    type: gt
                    params:
                      - 131072000

      - uid: kafka-dlq-message-growth
        title: 'kafka dlq message growth'
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          severity: P1
        notification_settings:
          receiver: cloudmax-webhook
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              expr: 'increase(kafka_topic_partition_current_offset{topic="booking-events-dlq"}[5m])'
              instant: true
              range: false
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0

      - uid: postgres-sharerowexclusive-lock
        title: 'postgres share row exclusive lock detected'
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          severity: P1
        notification_settings:
          receiver: cloudmax-webhook
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              expr: 'pg_locks_count{datname="hotel_booking_db",mode="sharerowexclusivelock"}'
              instant: true
              range: false
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0

      - uid: nginx-error
        title: 'nginx error'
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        isPaused: true
        labels:
          severity: P1
        notification_settings:
          receiver: cloudmax-webhook
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              expr: 'sum(rate(nginx_http_response_count_total{method="",path="",status=~"5.."}[5m])) > 0'
              instant: true
              range: false
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0

      - uid: high-api-failure
        title: high api failure
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        isPaused: true
        labels:
          severity: P1
        notification_settings:
          receiver: cloudmax-webhook
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              expr: 'sum by (instance, job, namespace, pod) (rate(nginx_http_response_count_total{status=~"5.."}[5m])) > 0.5'
              instant: true
              range: false
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0

      - uid: high-consumer-lag-detection
        title: High Consumer Lag detection
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          severity: P1
        notification_settings:
          receiver: cloudmax-webhook
        data:
          # kafka_consumergroup_lag is a GAUGE (confirmed live:
          # `# TYPE kafka_consumergroup_lag gauge` from kafka-exporter's own
          # /metrics output) -- it IS the current lag value, not a counter
          # of lag events. Wrapping it in rate() computed the per-second
          # RATE OF CHANGE of lag instead of the lag itself, so a consumer
          # group permanently stuck hundreds of messages behind (the exact
          # scenario this alert exists to catch) would sit at rate() ~= 0
          # and never cross the "gte 10" threshold -- the alert could never
          # fire for a real, sustained high-lag incident. Query the raw
          # gauge directly instead.
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              expr: 'kafka_consumergroup_lag{topic="booking-events"}'
              instant: true
              range: false
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gte
                    params:
                      - 10

      - uid: nginx-high-http-error-count
        title: Nginx_High_HTTP_Error_Count
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        isPaused: true
        labels:
          severity: P1
        notification_settings:
          receiver: cloudmax-webhook
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              expr: 'sum(increase(nginx_http_response_count_total{method="",path="",status=~"5.."}[5m])) > 0'
              instant: true
              range: false
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 10
