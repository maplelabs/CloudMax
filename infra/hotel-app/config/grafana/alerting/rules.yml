# File-provisioned Grafana alert rule(s) for the hotel reservation app.
# Auto-created in the "Hotel Reservation Alerts" folder (Grafana creates
# the folder itself if it doesn't already exist) on every Grafana startup
# -- no runtime API calls or manual UI setup needed.
#
# References the prometheus datasource by its fixed uid (see
# ../datasource.yml) and the cloudmax-webhook contact point (see
# ./contactpoints.yml / ./policies.yml) for where alerts get routed.
apiVersion: 1

# disableProvenance: once Grafana applies this file, it stops marking these
# rules as provenance=file (which otherwise locks them read-only in the UI
# -- no edit, no pause-evaluation toggle, regardless of the user's role).
# With this set, the file still seeds/updates rules as before, but afterward
# they behave like normal UI-managed rules: editable, pausable, deletable.
# Trade-off (accepted): once a rule has been edited in the UI on a given
# Grafana instance, future changes to this file will NOT be reapplied to
# that already-provisioned rule on that instance (only to instances where
# the rule doesn't exist yet, e.g. a fresh VM) -- so UI edits and this file
# can drift apart on long-lived demo VMs. Re-running demo-create.yml against
# a FRESH VM is unaffected and always gets the file's current version.
disableProvenance: true

groups:
  - orgId: 1
    name: hotel-app-alerts
    folder: Hotel Reservation Alerts
    interval: 1m
    rules:
      - uid: nginx-5xx-high
        title: Nginx HTTP 5xx Errors High
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Nginx is returning HTTP 5xx errors on the hotel reservation app
        labels:
          severity: P1
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              expr: 'sum(rate(nginx_http_response_count_total{status=~"5.."}[5m]))'
              instant: false
              range: true
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: B
              type: reduce
              expression: A
              reducer: dropNN
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0

  # --- Second group: broader fault-detection coverage previously
  # configured by hand in the live Grafana UI (exported as
  # alert-rules.yaml at the repo root, which is a raw Grafana export --
  # not usable directly, since it embeds a live instance's
  # auto-generated datasource uid (P1809F7CD0C75ACF3), per-rule UI-only
  # fields, and non-standalone classic-condition syntax). Re-authored
  # here as plain file-provisioning input: same PromQL expressions and
  # thresholds, repointed at our fixed prometheus-ds uid, trimmed to
  # only the fields provisioning actually needs, and routed through the
  # same cloudmax-webhook contact point. isPaused is preserved exactly
  # as it was left in the live instance (3 of these were intentionally
  # paused -- likely superseded/being iterated on alongside the
  # nginx-5xx-high rule above).
  - orgId: 1
    name: hotel-reservation-application-alerts
    folder: Hotel Reservation Application
    interval: 1m
    rules:
      - uid: docker-container-restart
        title: 'docker container restart'
        condition: C
        for: 1m
        noDataState: NoData
        execErrState: Error
        isPaused: false
        notification_settings:
          receiver: cloudmax-webhook
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              expr: 'resets(container_cpu_usage_seconds_total{container_label_com_docker_compose_service=~"zookeeper|kafka|postgres|elasticsearch|frontend|nodejs-bff|search-service|booking-service|booking-post-processing-service|invoice-service",cpu="total"}[5m])'
              instant: true
              range: false
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0

      - uid: search-service-rapid-memory-growth
        title: search service rapid memory growth
        condition: C
        for: 1m
        noDataState: NoData
        execErrState: Error
        isPaused: false
        notification_settings:
          receiver: cloudmax-webhook
        data:
          # container_memory_usage_bytes is a GAUGE (confirmed live:
          # `# TYPE container_memory_usage_bytes gauge` from cAdvisor's own
          # /metrics output), not a counter. rate() assumes a monotonically
          # increasing counter and treats any decrease as a "reset" --
          # applying it to a gauge produces meaningless/misleading values
          # whenever memory usage drops at all between scrapes. deriv()
          # is the correct PromQL function for a gauge's per-second rate of
          # change (linear regression over the range, handles decreases
          # correctly instead of misinterpreting them as counter resets).
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              expr: 'deriv(container_memory_usage_bytes{container_label_com_docker_compose_service="search-service"}[5m])'
              instant: true
              range: false
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 700000

      - uid: search-service-high-memory-usage
        title: search service high memory usage
        condition: C
        for: 1m
        noDataState: NoData
        execErrState: Error
        isPaused: false
        notification_settings:
          receiver: cloudmax-webhook
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              expr: 'container_memory_usage_bytes{container_label_com_docker_compose_service="search-service"}'
              instant: true
              range: false
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 104857600

      - uid: kafka-dlq-message-growth
        title: 'kafka dlq message growth'
        condition: C
        for: 1m
        noDataState: NoData
        execErrState: Error
        isPaused: false
        notification_settings:
          receiver: cloudmax-webhook
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              expr: 'increase(kafka_topic_partition_current_offset{topic="booking-events-dlq"}[5m])'
              instant: true
              range: false
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0

      - uid: postgres-sharerowexclusive-lock
        title: 'postgres share row exclusive lock detected'
        condition: C
        for: 1m
        noDataState: NoData
        execErrState: Error
        isPaused: false
        notification_settings:
          receiver: cloudmax-webhook
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              expr: 'pg_locks_count{datname="hotel_booking_db",mode="sharerowexclusivelock"}'
              instant: true
              range: false
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0

      - uid: nginx-error
        title: 'nginx error'
        condition: C
        for: 1m
        noDataState: NoData
        execErrState: Error
        isPaused: true
        notification_settings:
          receiver: cloudmax-webhook
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              expr: 'sum(rate(nginx_http_response_count_total{method="",path="",status=~"5.."}[5m])) > 0'
              instant: true
              range: false
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0

      - uid: high-api-failure
        title: high api failure
        condition: C
        for: 1m
        noDataState: NoData
        execErrState: Error
        isPaused: true
        notification_settings:
          receiver: cloudmax-webhook
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              expr: 'sum by (instance, job, namespace, pod) (rate(nginx_http_response_count_total{status=~"5.."}[5m])) > 0.5'
              instant: true
              range: false
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0

      - uid: high-consumer-lag-detection
        title: High Consumer Lag detection
        condition: C
        for: 1m
        noDataState: NoData
        execErrState: Error
        isPaused: false
        notification_settings:
          receiver: cloudmax-webhook
        data:
          # kafka_consumergroup_lag is a GAUGE (confirmed live:
          # `# TYPE kafka_consumergroup_lag gauge` from kafka-exporter's own
          # /metrics output) -- it IS the current lag value, not a counter
          # of lag events. Wrapping it in rate() computed the per-second
          # RATE OF CHANGE of lag instead of the lag itself, so a consumer
          # group permanently stuck hundreds of messages behind (the exact
          # scenario this alert exists to catch) would sit at rate() ~= 0
          # and never cross the "gte 10" threshold -- the alert could never
          # fire for a real, sustained high-lag incident. Query the raw
          # gauge directly instead.
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              expr: 'kafka_consumergroup_lag{topic="booking-events"}'
              instant: true
              range: false
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gte
                    params:
                      - 10

      - uid: nginx-high-http-error-count
        title: Nginx_High_HTTP_Error_Count
        condition: C
        for: 1m
        noDataState: NoData
        execErrState: Error
        isPaused: true
        notification_settings:
          receiver: cloudmax-webhook
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              expr: 'sum(increase(nginx_http_response_count_total{method="",path="",status=~"5.."}[5m])) > 0'
              instant: true
              range: false
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 10
