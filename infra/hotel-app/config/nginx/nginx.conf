events {
    worker_connections 1024;
}

http {
    # Log format and access log
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    
    # Write to both file and stdout for log exporter + docker logs
    access_log /var/log/nginx/access.log main;
    access_log /dev/stdout main;
    
    error_log /var/log/nginx/error.log;
    error_log /dev/stderr;

    # Upstream services
    upstream frontend {
        server frontend:3001;
    }
    
    upstream nodejs_bff {
        server nodejs-bff:3000;
    }
    
    upstream auth_service {
        server authentication-service:9000;
    }

    # Main server block
    server {
        listen 80;
        server_name _;  # Accept requests from any hostname (localhost or VM IP)

        # Frontend routes
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API routes to Node.js BFF
        location /api/ {
            proxy_pass http://nodejs_bff;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth routes
        location /auth/ {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Nginx metrics endpoint for prometheus exporter
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;  # Docker networks
            deny all;
        }
    }
}




