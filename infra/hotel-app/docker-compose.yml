# Vendored and adapted from maplelabs/fault-injector's
# target-applications/hotel-reservation-application/docker-compose.yml.
#
# Adaptations from the upstream file (see image-build-push-hotel.yml and
# demo-create.yml for how this is used):
#   - The 7 services that had `build:` blocks now reference pre-built images
#     in ACR instead (${ACR_REGISTRY}/${IMAGE_NAMESPACE}/hotel-<service>:${HOTEL_IMAGE_TAG}),
#     built by image-build-push-hotel.yml from the upstream repo's source.
#     This means demo-create.yml never needs to clone/read the private
#     fault-injector repo at deploy time -- only `az acr login` (OIDC,
#     already set up for CloudMax's own images) plus `docker compose pull`.
#   - Dropped the dev-mode `./src/...:/app` bind-mounts on search-service,
#     booking-service, and booking-post-processing-service -- those existed
#     only for upstream's local hot-reload workflow and would otherwise
#     shadow the code already baked into the image via each Dockerfile's
#     COPY. Not needed (or wanted) for an image-based deploy.
#   - REACT_APP_API_URL parameterized via ${PUBLIC_IP} instead of a
#     hardcoded IP -- confirmed safe to set at container *runtime* (not
#     build time): the frontend's Dockerfile runs `npm start` (CRA dev
#     server), which reads this env var live, it is not baked into a static
#     build.
#   - nginx now binds host port 8090 directly (was 80, which collides with
#     cloudmax-frontend's own 80/443 binding on the same demo VM) -- set
#     directly here rather than via a separate docker-compose.override.yml,
#     since we own this file; avoids a real Compose pitfall encountered
#     earlier where an override file's `ports:` list MERGED with the
#     upstream file's instead of replacing it, so both 80 and 8090 bindings
#     were attempted and 80 collided.
#   - The ./config, ./database/init, and ./grafana-dashboards relative
#     volume paths are unchanged -- this repo vendors those same paths
#     under infra/hotel-app/ (see config/, database/init/,
#     grafana-dashboards/ alongside this file), so they still resolve
#     correctly when `docker compose` is run from this directory.
#
# All other services (postgres, elasticsearch, kafka, nginx, grafana,
# jaeger, prometheus, loki, promtail, cadvisor, the exporters, and the two
# MCP servers) already used public images upstream and are unchanged here.

services:
  nodejs-bff:
    image: ${ACR_REGISTRY}/${IMAGE_NAMESPACE}/hotel-nodejs-bff:${HOTEL_IMAGE_TAG}
    labels:
      service: nodejs-bff
    ports:
      - "8085:3000"
    environment:
      - SEARCH_SERVICE_URL=http://search-service:8000
      - AUTH_SERVICE_URL=http://authentication-service:9000
      - BOOKING_SERVICE_URL=http://booking-service:8001
      - JWT_SECRET=MyApp-Super-Secret-Key-2024-Extended-For-HMAC-SHA256-Security-Docker
      # OpenTelemetry Tracing Configuration
      - TRACING_ENABLED=${TRACING_ENABLED}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=nodejs-bff
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=hotel-reservation,service.version=1.0.0
    depends_on:
      - search-service
      - authentication-service
      - booking-service
      - otel-collector
    # volumes:
    #   - ./src/backend/services/nodejs-bff:/app
    #   - /app/node_modules
    networks:
      - hotel_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"

  search-service:
    image: ${ACR_REGISTRY}/${IMAGE_NAMESPACE}/hotel-search-service:${HOTEL_IMAGE_TAG}
    ports:
      - "8083:8000"
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - JWT_SECRET=MyApp-Super-Secret-Key-2024-Extended-For-HMAC-SHA256-Security-Docker
      - FAULT_SERVICE_URL=http://host.docker.internal:8010/app-fault
      # OpenTelemetry Tracing Configuration
      - TRACING_ENABLED=${TRACING_ENABLED}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=search-service
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=hotel-reservation,service.version=1.0.0
    depends_on:
      - elasticsearch
      - otel-collector
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - hotel_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"
    mem_limit: 500m
    restart: always

  authentication-service:
    image: ${ACR_REGISTRY}/${IMAGE_NAMESPACE}/hotel-authentication-service:${HOTEL_IMAGE_TAG}
    labels:
      service: authentication-service
    ports:
      - "9000:9000"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/hotel_auth_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - JWT_SECRET=MyApp-Super-Secret-Key-2024-Extended-For-HMAC-SHA256-Security-Docker
      # OpenTelemetry Tracing Configuration
      - TRACING_ENABLED=${TRACING_ENABLED}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SERVICE_NAME=authentication-service
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=hotel-reservation,service.version=1.0.0
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
    depends_on:
      - postgres
      - otel-collector
    networks:
      - hotel_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"

  booking-service:
    image: ${ACR_REGISTRY}/${IMAGE_NAMESPACE}/hotel-booking-service:${HOTEL_IMAGE_TAG}
    labels:
      service: booking-service
    ports:
      - "8084:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=hotel_booking_db
      - DB_USER=postgres
      - DB_PASSWORD=password
      - JWT_SECRET=MyApp-Super-Secret-Key-2024-Extended-For-HMAC-SHA256-Security-Docker
      - SEARCH_SERVICE_URL=http://search-service:8000
      - FAULT_SERVICE_URL=http://host.docker.internal:8010
      - INJECT_SCHEMA_FAULT=true  # Uncomment to enable schema fault injection
      # OpenTelemetry Tracing Configuration
      - TRACING_ENABLED=${TRACING_ENABLED}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=booking-service
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=hotel-reservation,service.version=1.0.0
    depends_on:
      - postgres
      - search-service
      - otel-collector
    networks:
      - hotel_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"

  postgres:
    image: postgres:16
    container_name: hotel_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - hotel_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - hotel_network

  frontend:
    image: ${ACR_REGISTRY}/${IMAGE_NAMESPACE}/hotel-frontend:${HOTEL_IMAGE_TAG}
    labels:
      service: frontend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - REACT_APP_API_URL=http://${PUBLIC_IP}:80
      # OpenTelemetry Tracing Configuration
      - REACT_APP_TRACING_ENABLED=${TRACING_ENABLED}
      - REACT_APP_OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318/v1/traces
      - REACT_APP_OTEL_SERVICE_NAME=frontend
    depends_on:
      - otel-collector
    # Removed volume mounts for production deployment to avoid permission issues
    # volumes:
    #   - ./src/frontend/hotel-reservation-ui:/app
    #   - /app/node_modules
    networks:
      - hotel_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"

  invoice-service:
    image: ${ACR_REGISTRY}/${IMAGE_NAMESPACE}/hotel-invoice-service:${HOTEL_IMAGE_TAG}
    labels:
      service: invoice-service
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      # OpenTelemetry Tracing Configuration
      - TRACING_ENABLED=${TRACING_ENABLED}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=invoice-service
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=hotel-reservation,service.version=1.0.0
    depends_on:
      - otel-collector
    networks:
      - hotel_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"

  booking-post-processing-service:
    image: ${ACR_REGISTRY}/${IMAGE_NAMESPACE}/hotel-booking-post-processing-service:${HOTEL_IMAGE_TAG}
    labels:
      service: booking-post-processing-service
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - INVOICE_SERVICE_URL=http://invoice-service:8003
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=hotel_booking_db
      - DB_USER=postgres
      - DB_PASSWORD=password
      # OpenTelemetry Tracing Configuration
      - TRACING_ENABLED=${TRACING_ENABLED}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=booking-post-processing-service
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=hotel-reservation,service.version=1.0.0
    depends_on:
      - kafka
      - postgres
      - invoice-service
      - otel-collector
    networks:
      - hotel_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - hotel_network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    networks:
      - hotel_network

  # Kafka Exporter - Exports Kafka metrics to Prometheus
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: hotel-kafka-exporter
    command:
      - '--kafka.server=kafka:9092'
      - '--web.listen-address=:9308'
    ports:
      - "9308:9308"
    depends_on:
      - kafka
    networks:
      - hotel_network
    restart: unless-stopped
  # ******************
  # Telemetry Services
  # ******************

  # OpenTelemetry Collector - Receives traces from all services
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.97.0
    container_name: hotel-otel-collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./config/otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Prometheus metrics exposed by the collector
      - "8889:8889"   # Prometheus exporter metrics
    networks:
      - hotel_network
    restart: unless-stopped

  # Jaeger - Distributed Tracing UI
  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: hotel-jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "14250:14250"  # gRPC receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      # ✅ NEW: Badger Storage with 1 Hour TTL
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
      - BADGER_SPAN_STORE_TTL=1h  # ✅ 1 HOUR RETENTION!
    volumes:
      - jaeger_badger_data:/badger  # ✅ NEW VOLUME
    user: root 
      
    networks:
      - hotel_network
    restart: unless-stopped

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: hotel-nginx
    ports:
      - "8090:80"
    volumes:
      - nginx_logs:/var/log/nginx
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    # The nginx:alpine image ships /var/log/nginx/access.log and error.log
    # as symlinks to /dev/stdout / /dev/stderr (for `docker logs` visibility).
    # The nginx_logs named volume above is seeded from those symlinks on
    # first mount, which breaks hotel-nginx-log-exporter (it tails/seeks the
    # file directly -- "panic: Seek error ... illegal seek" against a pipe).
    # Our nginx.conf already writes access_log to both the real file path
    # and /dev/stdout explicitly, so replacing the symlinks with real files
    # before nginx starts keeps `docker logs hotel-nginx` working via the
    # explicit /dev/stdout directive while giving the exporter a real,
    # seekable file to tail.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        rm -f /var/log/nginx/access.log /var/log/nginx/error.log
        touch /var/log/nginx/access.log /var/log/nginx/error.log
        exec nginx -g 'daemon off;'
    depends_on:
      - frontend
      - nodejs-bff
      - authentication-service
    networks:
      - hotel_network
    restart: unless-stopped

  # Nginx exporter
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: hotel-nginx-exporter
    ports:
      - "9113:9113"
    command:
      - '-nginx.scrape-uri=http://nginx/nginx_status'
    depends_on:
      - nginx
    networks:
      - hotel_network
    restart: unless-stopped

  # Nginx Log Exporter - Parses nginx logs for Prometheus metrics
  nginx-log-exporter:
    image: quay.io/martinhelmich/prometheus-nginxlog-exporter:v1.10.0
    container_name: hotel-nginx-log-exporter
    volumes:
      - nginx_logs:/var/log/nginx:ro
      - ./config/nginx-log-exporter.yml:/etc/config/nginx-log-exporter.yml:ro
    command: ["-config-file", "/etc/config/nginx-log-exporter.yml"]
    ports:
      - "4040:4040"
    networks:
      - hotel_network
    restart: unless-stopped

  # Prometheus - Metrics collection and storage
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: hotel-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=2h'
      - '--web.enable-lifecycle'
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - hotel_network
    restart: unless-stopped

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: hotel-grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards/hotel:ro
      - ./config/grafana/dashboard-config.yml:/etc/grafana/provisioning/dashboards/dashboard-config.yml:ro
      - ./config/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    depends_on:
      - prometheus
    networks:
      - hotel_network
    restart: unless-stopped

  # cAdvisor - Container metrics collection
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: hotel-cadvisor
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - hotel_network
    restart: unless-stopped

  # PostgreSQL Exporter - Database metrics
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: hotel-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:password@postgres:5432/postgres?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - postgres
    networks:
      - hotel_network
    restart: unless-stopped

  # Loki - Log aggregation system
  loki:
    image: grafana/loki:2.9.0
    container_name: hotel-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./config/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    networks:
      - hotel_network
    restart: unless-stopped

  # Promtail - Log shipper for Loki
  promtail:
    image: grafana/promtail:2.9.0
    container_name: hotel-promtail
    volumes:
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nginx_logs:/var/log/nginx:ro
      - ./config/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - hotel_network
    restart: unless-stopped

  # MCP Servers for AI-SRE-OPS Integration

  # Grafana MCP Server - Exposes Grafana tools via MCP protocol
  grafana-mcp-server:
    image: thouqueerahmedml/otel-demo:mcp-grafana-0.6.2
    container_name: hotel-grafana-mcp
    ports:
      - "8012:8000"
    environment:
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_API_KEY=${GRAFANA_API_KEY:-}
      - DISABLED_CATEGORIES=admin,incident,alerting,oncall,sift,pyroscope,asserts,navigation
    command: ["-t", "streamable-http"]
    depends_on:
      - grafana
    networks:
      - hotel_network
    restart: unless-stopped

  # Jaeger MCP Server - Exposes Jaeger tools via MCP protocol
  jaeger-mcp-server:
    image: docker.io/thouqueerahmedml/jaeger-mcp:latest
    platform: linux/amd64
    container_name: hotel-jaeger-mcp
    ports:
      - "8011:8000"
    environment:
      - JAEGER_API_URL=http://jaeger:16686
      - JAEGER_URL=http://jaeger:16686
      - JAEGER_PROTOCOL=HTTP
      - JAEGER_PORT=16686
      - FASTMCP_EXPERIMENTAL_ENABLE_NEW_OPENAPI_PARSER=true
    depends_on:
      - jaeger
    networks:
      - hotel_network
    restart: unless-stopped  

volumes:
  es_data:
  postgres_data:
  jaeger_badger_data:
  grafana_data:
  nginx_logs:
  prometheus_data:
  loki_data:

networks:
  hotel_network:
    driver: bridge



































