name: Feature request
description: Suggest an idea or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Focus on the problem and desired outcome — technical implementation details are optional.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the current limitation or pain point.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What outcome would you like?
      description: Describe what success looks like from your perspective.
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: Suggested implementation (optional)
      description: If you have thoughts on how this could be built, share them here.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
    validations:
      required: false
