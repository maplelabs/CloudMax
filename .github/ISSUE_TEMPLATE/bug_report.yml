name: Bug report
description: Report something that isn't working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please **do not** include secrets, credentials, or personal/customer data in this report or in any attached logs.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of CloudMax is affected?
      options:
        - core/backend
        - core/frontend
        - agents/code-triage
        - diagnostics
        - docs
        - CI / build / tooling
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Release version, tag, or commit SHA where you observed the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, runtime versions, deployment type, etc.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove any secrets and personal or customer data before pasting logs.
    validations:
      required: false
