# Builds and publishes two independent groups of custom-built images from the
# private maplelabs/fault-injector repo to ACR, so demo-create.yml's deploy
# steps never need to clone or read that repo on the demo VM itself
# (previously done via a GitHub PAT stored in cloudmax-kv's
# fault-injector-read-token secret -- removed, see kv-bootstrap-secrets.yml):
#
#   - hotel-*: the hotel-reservation-application TARGET app's 7 custom-built
#     services (under target-applications/hotel-reservation-application/).
#     Only 7 of the ~24 services in that app's docker-compose.yml have a
#     `build:` block; the rest (postgres, elasticsearch, kafka, nginx,
#     grafana, jaeger, prometheus, loki, promtail, cadvisor, the exporters,
#     and the two MCP servers) already use public images and are
#     untouched/unpublished here.
#
#   - fault-injector-*: the fault-injector PLATFORM's own 4 custom-built
#     services (at the repo root, under src/backend/services/ and
#     src/frontend/fault-gen-app/) -- the Airflow-based chaos engineering
#     control plane users interact with to actually trigger faults against
#     the hotel app. Airflow itself (webserver/scheduler/worker/triggerer)
#     uses the public priyanshu01ce/airflow_chaos:latest image directly and
#     is not built/pushed here -- see infra/fault-injector/docker-compose.yml.
#
# Authentication:
#   - FAULT_INJECTOR_READ_TOKEN (repo secret, NOT Key Vault): a read-only,
#     fine-grained GitHub PAT scoped to just maplelabs/fault-injector, used
#     solely for actions/checkout here, at build time, inside this runner.
#     This is a deliberately smaller exposure than the previous design: no
#     VM ever holds this credential, it is not re-fetched on every demo
#     create, and it never leaves GitHub Actions' own secret store. Someone
#     with access to maplelabs/fault-injector needs to generate this PAT and
#     add it via repo Settings -> Secrets and variables -> Actions, or
#     `gh secret set FAULT_INJECTOR_READ_TOKEN -R maplelabs/CloudMax`.
#   - Azure OIDC (azure/login, same CloudMaX-App-GitHub-Int identity as
#     image-build-push.yml) for `az acr login` -- no registry password
#     stored, same as CloudMax's own images.
#
# Manually triggered only -- the hotel app has its own release cadence in
# its own repo, independent of CloudMax's push-to-main. Re-run this whenever
# fault-injector's hotel-reservation-application source changes and you want
# demo-create.yml's hotel app deploy to pick up the update (it always pulls
# the `:latest` tag from these ACR images, pinned via demo-create.yml's
# HOTEL_IMAGE_TAG, mirroring the `:latest`/`:sha-<gitsha>` policy already
# used for CloudMax's own images in image-build-push.yml).

name: Build and Push Hotel App and Fault-Injector Images

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: image-build-push-hotel
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push ${{ matrix.component.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          # --- hotel-reservation-application (target app) -----------------
          - image: hotel-nodejs-bff
            context: target-applications/hotel-reservation-application/src/backend/services/nodejs-bff
          - image: hotel-search-service
            context: target-applications/hotel-reservation-application/src/backend/services/search_service
          - image: hotel-authentication-service
            context: target-applications/hotel-reservation-application/src/backend/services/authentication
          - image: hotel-booking-service
            context: target-applications/hotel-reservation-application/src/backend/services/booking_service
          - image: hotel-frontend
            context: target-applications/hotel-reservation-application/src/frontend/hotel-reservation-ui
          - image: hotel-invoice-service
            context: target-applications/hotel-reservation-application/src/backend/services/invoice-service
          - image: hotel-booking-post-processing-service
            context: target-applications/hotel-reservation-application/src/backend/services/booking-post-processing-service
          # --- fault-injector platform (chaos engineering control plane) --
          - image: fault-injector-service
            context: src/backend/services/fault-service
          - image: fault-injector-notification
            context: src/backend/services/fault-notification
          - image: fault-injector-ui-backend
            context: src/backend/services/nodejs-bff
          - image: fault-injector-ui-frontend
            context: src/frontend/fault-gen-app
    env:
      FAULT_INJECTOR_READ_TOKEN: ${{ secrets.FAULT_INJECTOR_READ_TOKEN }}
    steps:
      - name: Fail fast if FAULT_INJECTOR_READ_TOKEN is not configured
        if: ${{ env.FAULT_INJECTOR_READ_TOKEN == '' }}
        run: |
          echo "::error::Repository secret FAULT_INJECTOR_READ_TOKEN is not set. Add a read-only, fine-grained GitHub PAT scoped to maplelabs/fault-injector before this pipeline can check it out."
          exit 1

      - name: Fail fast if registry is not configured
        if: ${{ vars.ACR_REGISTRY == '' }}
        run: |
          echo "::error::Repository variable ACR_REGISTRY is not set. Configure it before this pipeline can push images."
          exit 1

      - name: Checkout fault-injector
        uses: actions/checkout@v4
        with:
          repository: maplelabs/fault-injector
          ref: master
          token: ${{ secrets.FAULT_INJECTOR_READ_TOKEN }}
          path: fault-injector

      - name: Resolve image metadata
        id: meta
        working-directory: fault-injector
        run: |
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          NAMESPACE="${{ vars.IMAGE_NAMESPACE }}"
          if [ -z "$NAMESPACE" ]; then
            NAMESPACE="cloudmax"
          fi
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_repo=${{ vars.ACR_REGISTRY }}/${NAMESPACE}/${{ matrix.component.image }}" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR via az acr login (no stored registry password)
        run: |
          ACR_NAME="$(echo "${{ vars.ACR_REGISTRY }}" | cut -d'.' -f1)"
          az acr login --name "${ACR_NAME}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.component.image }}
        uses: docker/build-push-action@v6
        with:
          context: fault-injector/${{ matrix.component.context }}
          file: fault-injector/${{ matrix.component.context }}/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_repo }}:sha-${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.image_repo }}:latest
          provenance: false

      - name: Azure logout
        if: always()
        run: az logout || true
