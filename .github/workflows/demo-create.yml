# DEMO-01.3: create a CloudMax demo environment on-demand.
#
# Manually triggered (workflow_dispatch) -- provisions a demo VM via the
# DEMO-01.2 Terraform module, restoring from the latest available OS/data
# snapshot (or a fresh base image on the very first run for a demo lineage --
# see DEMO-01.1 Sec 3.1/Sec 4), deploys the CloudMax stack, health-checks it,
# and reports the demo's public URL.
#
# Authentication: OIDC (Azure AD federated credential, the
# CloudMaX-App-GitHub-Int App Registration -- DEMO-01.5's as-built identity,
# which also handles IMG-01's AcrPush) -- no client secret stored.
#
# KNOWN GAP (see DEMO-01.5 doc, Sec 5): secrets are repo-level, not
# Environment-level. A `demo` GitHub Environment was created but is left
# ungated (no required reviewers) for now, and is deliberately NOT
# referenced by this job (see note below) -- so there is currently no
# reviewer gate beyond who has workflow_dispatch access to the repo.
#
# NOTE: this job intentionally does NOT set `environment: demo`. GitHub's
# OIDC token subject claim changes to `repo:<org>/<repo>:environment:<name>`
# for any job that targets an Environment -- overriding the branch-ref
# subject (`repo:...:ref:refs/heads/main`) that CloudMaX-App-GitHub-Int's
# federated credential is actually configured for, regardless of what
# triggered the run. Setting `environment: demo` here caused a real
# AADSTS700213 failure ("No matching federated identity record") when
# tested. If/when the `demo` Environment gets required-reviewer protection
# (making it worth referencing), a matching federated credential subject
# (`repo:maplelabs/CloudMax:environment:demo`) must be added to the App
# Registration first, or this job will fail Azure login again.
#
# This workflow intentionally only triggers on workflow_dispatch -- never on
# pull_request or any fork-triggerable event, since the identity it assumes
# has Contributor on the `cloudmax` resource group (DEMO-01.5 Sec 3).
#
# Deploys docker-compose.prod.yml (reduced core set: backend, frontend,
# code-triage-agent, diagnostic-mcp-server, mcp-nginx -- IMG-01's 5 built
# images -- plus postgres/redis/opa as plain off-the-shelf containers the
# backend/mcp-nginx need to run). The repo (containing that compose file and
# the policies/certs directories it mounts) is fetched onto the VM via an
# authenticated `git clone` using a short-lived GITHUB_TOKEN passed as a
# run-command parameter (never embedded in the script text or logged) --
# still no SSH key or long-lived PAT involved.
#
# POSTGRES_PASSWORD / REDIS_QUEUE_AUTH are fetched from the cloudmax-kv Key
# Vault using the VM's own system-assigned managed identity (DEMO-01.2,
# DEMO-01.5 Sec 4) -- never passed through GitHub Actions or stored on disk
# outside the VM's own runtime environment.
#
# Default-on: this workflow deploys THREE independent docker-compose
# projects onto the same demo VM, each with its own private bridge network,
# forming the full end-to-end chaos engineering + AI triage demo:
#
#   1. cloudmax (docker-compose.prod.yml, always deployed): backend,
#      frontend, code-triage-agent, mcp-server/mcp-nginx, postgres, redis,
#      opa -- the AI-SRE-Ops alert triage platform itself.
#   2. hotel (infra/hotel-app/docker-compose.yml, deploy_hotel_reservation_app
#      input, default true): fault-injector's hotel-reservation-application
#      TARGET app -- 7 custom-built services, Postgres, Elasticsearch,
#      Kafka+Zookeeper, plus a full observability stack (Jaeger, Prometheus,
#      Grafana, Loki/Promtail, cAdvisor) and two MCP servers for AI-SRE-Ops
#      integration (grafana-mcp-server, jaeger-mcp-server). A Grafana alert
#      rule (provisioned separately, see hotel-grafana's Alerting UI) fires
#      on faults and POSTs to cloudmax-backend's /v1/webhooks/alerts/grafana.
#   3. faultinjector (infra/fault-injector/docker-compose.yml,
#      deploy_fault_injector input, default true, no-op if
#      deploy_hotel_reservation_app is false): the fault-injector PLATFORM
#      itself -- an Airflow-based chaos engineering control plane a user
#      drives from its Fault Gen UI (port 4009) to manually trigger faults
#      (Postgres write locks, Kafka schema mismatches, container restarts,
#      memory stress, etc.) against the hotel app's containers, via Docker-
#      socket-spawned sibling containers running chaostoolkit experiments.
#      fault-notification also POSTs directly to cloudmax-backend's
#      /v1/fault-ledger endpoint with ground-truth "this exact fault was
#      injected" records, for comparison against the AI triage's own
#      root-cause diagnosis.
#
# End-to-end flow once all three are up: a user triggers a fault from the
# Fault Gen UI -> fault-injector executes it against a hotel-app container
# -> Jaeger/Grafana observe the resulting failure in the hotel app -> a
# Grafana alert rule fires -> CloudMax receives the alert via webhook and
# runs automated AI triage (code-triage-agent) -> the triage result can be
# compared against fault-notification's ground-truth fault-ledger record.
#
# This VM never clones or reads the private maplelabs/fault-injector repo at
# all. All 11 custom-built services across the hotel app (7) and the
# fault-injector platform (4) are pre-built and published to ACR by the
# separate image-build-push-hotel.yml pipeline (which does need read access
# to that repo, via a repo secret, FAULT_INJECTOR_READ_TOKEN -- a
# fine-grained, read-only PAT, used only at build time inside that
# workflow's own runner, never stored in Key Vault or on any VM). Each
# compose file (with image: refs instead of build: blocks) plus its
# config/database-init/dashboard/DAG/fault-definition assets are vendored
# into THIS repo under infra/hotel-app/ and infra/fault-injector/ -- see
# each directory's docker-compose.yml header comment for the exact
# adaptations made. This demo VM only needs `az acr login` (OIDC, already
# set up for CloudMax's own images) plus `docker compose pull` -- the same
# no-PAT-on-the-VM posture as the CloudMax deploy step above. The one
# exception is fault-injector's own Docker-socket requirement (see
# infra/fault-injector/docker-compose.yml header comment) -- a deliberate,
# acknowledged elevation needed for it to actually execute faults.
#
# Networking: all three docker-compose projects keep their own private
# bridge networks (no compose file declares an external/shared one, so none
# of the three repos/directories takes on a dependency on infrastructure
# owned by the others). Instead, after each stack is up, relevant containers
# are additionally attached to other projects' networks via `docker network
# connect --alias <service-name>`, so DNS-based service discovery works
# across stacks (e.g. CloudMax's mcp-server/backend can resolve
# hotel-grafana-mcp/hotel-jaeger-mcp/etc., the hotel stack's services can
# resolve cloudmax-backend/cloudmax-mcp-server/etc., and
# fault-injector's fault-notification can resolve cloudmax-backend).
#
# Sizing: the Terraform module's vm_size default is Standard_F8s_v2 (8 vCPU /
# 16 GiB, see variables.tf), sized for CloudMax plus the hotel stack's ~20
# extra containers plus fault-injector's ~11 (Airflow's webserver/scheduler/
# worker/triggerer/init, Postgres, Redis, and its 4 custom services), since
# both deploy_hotel_reservation_app and deploy_fault_injector now default to
# true. This workflow always uses that Terraform default -- no per-run size
# override input.
#
# Image tags: always :latest for every component (CloudMax's own 5 images,
# the hotel app's 7, and fault-injector's 4) -- no per-run tag override
# input. CloudMax's images don't yet have a :verified-style promotion gate
# published to ACR (see IMG-01), so :latest is the only tag guaranteed to
# exist; the hotel app/fault-injector pipelines never had one either.
#
# Public IP: the demo VM binds a pre-reserved, fixed static IP ("cloudmax-vm-ip",
# 135.232.101.211 at the time this was set) by default -- see
# variables.tf's public_ip_name comment. This is required because the hotel
# app's frontend has that address hardcoded at build time as its backend API
# URL; it is never created or destroyed by Terraform (referenced via a data
# source only), so demo-destroy.yml's `terraform destroy` never deletes it.
# This also means only one demo can use the default configuration at a time
# (one public IP, one NIC); override TF_VAR_public_ip_name to "" (or a
# different pre-existing IP name) to run additional demos concurrently.

name: Create Demo Environment

on:
  workflow_dispatch:
    inputs:
      demo_name:
        description: "Short identifier for this demo (e.g. 'acme-poc'). Used to name/tag all resources."
        required: true
        type: string
      deploy_hotel_reservation_app:
        description: "Also deploy the fault-injector hotel-reservation-application target app alongside CloudMax (from pre-built ACR images, see image-build-push-hotel.yml), networked so both stacks can reach each other. Defaults to true -- set false to skip it and deploy CloudMax alone."
        required: false
        type: boolean
        default: true
      deploy_fault_injector:
        description: "Also deploy the fault-injector chaos engineering platform itself, alongside CloudMax and the hotel app, so a user can manually trigger faults against the hotel app from its Fault Gen UI. Defaults to true -- has no effect if deploy_hotel_reservation_app is false."
        required: false
        type: boolean
        default: true
      seed_config_only_vm_name:
        description: "ADMIN/REPAIR USE ONLY, leave blank for a normal create. If set to an existing demo VM name, skips all provisioning/deploy steps and only re-runs the LLM/embedding + MCP config seed steps against that VM -- for fixing config drift without a full redeploy."
        required: false
        type: string
        default: ""

# Least-privilege: read-only repo access, plus the OIDC id-token needed for
# Azure login. No write access to repo contents/packages is requested.
permissions:
  contents: read
  id-token: write

# Avoid two concurrent creates for the same demo racing each other and
# double-provisioning / conflicting Terraform state.
concurrency:
  group: demo-create-${{ inputs.demo_name }}
  cancel-in-progress: false

jobs:
  create:
    name: Provision & deploy demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Resolve latest snapshots (steady-state) or none (bootstrap)
        id: snapshots
        if: ${{ inputs.seed_config_only_vm_name == '' }}
        run: |
          set -euo pipefail
          RG="${{ vars.DEMO_RESOURCE_GROUP }}"
          if [ -z "$RG" ]; then
            echo "::error::Repository variable DEMO_RESOURCE_GROUP is not set."
            exit 1
          fi

          # Latest snapshot per disk role, tagged by DEMO-01.4's destroy
          # workflow as disk-role=os / disk-role=data for this demo_name.
          # If none exist yet, this is the bootstrap create (DEMO-01.1 Sec 3.1)
          # and both outputs are left empty -- the Terraform module falls
          # back to a fresh base image / empty data disk in that case.
          OS_SNAP=$(az snapshot list -g "$RG" \
            --query "[?tags.\"demo-name\"=='${{ inputs.demo_name }}' && tags.\"disk-role\"=='os'] | sort_by(@, &timeCreated)[-1].id" \
            -o tsv)
          DATA_SNAP=$(az snapshot list -g "$RG" \
            --query "[?tags.\"demo-name\"=='${{ inputs.demo_name }}' && tags.\"disk-role\"=='data'] | sort_by(@, &timeCreated)[-1].id" \
            -o tsv)

          echo "os_snapshot_id=${OS_SNAP}" >> "$GITHUB_OUTPUT"
          echo "data_snapshot_id=${DATA_SNAP}" >> "$GITHUB_OUTPUT"

          if [ -z "$OS_SNAP" ] || [ -z "$DATA_SNAP" ]; then
            echo "No prior snapshot found for '${{ inputs.demo_name }}' -- bootstrap create (fresh disks)."
          else
            echo "Restoring from snapshots: OS=${OS_SNAP} DATA=${DATA_SNAP}"
          fi

      # The azurerm backend/provider default to reading Azure CLI's cached
      # login (use_cli=true), but CLI-based auth only supports interactive
      # User accounts, not Service Principals -- which is what azure/login's
      # OIDC session actually is (confirmed via a real failed run: "Error
      # building ARM Config: Authenticating using the Azure CLI is only
      # supported as a User (not a Service Principal)"). ARM_USE_OIDC=true
      # makes both the backend (state storage) and provider authenticate
      # directly via GitHub's OIDC token instead, reusing the
      # ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN env vars GitHub auto-populates for
      # any job with `permissions: id-token: write` (already set above) --
      # no separate token-fetch step needed.
      - name: Terraform init
        if: ${{ inputs.seed_config_only_vm_name == '' }}
        working-directory: infra/terraform/demo-env
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=demo-env/${{ inputs.demo_name }}.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -backend-config="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -backend-config="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Terraform apply
        id: apply
        if: ${{ inputs.seed_config_only_vm_name == '' }}
        working-directory: infra/terraform/demo-env
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          TF_VAR_demo_name: ${{ inputs.demo_name }}
          TF_VAR_resource_group_name: ${{ vars.DEMO_RESOURCE_GROUP }}
          TF_VAR_container_registry_id: ${{ vars.ACR_REGISTRY_ID }}
          TF_VAR_key_vault_id: ${{ vars.DEMO_KEY_VAULT_ID }}
          TF_VAR_os_disk_snapshot_id: ${{ steps.snapshots.outputs.os_snapshot_id }}
          TF_VAR_data_disk_snapshot_id: ${{ steps.snapshots.outputs.data_snapshot_id }}
          TF_VAR_admin_ssh_public_key: ${{ vars.DEMO_ADMIN_SSH_PUBLIC_KEY }}
        run: |
          # TF_VAR_os_disk_snapshot_id / TF_VAR_data_disk_snapshot_id (set in
          # this step's env above) are picked up by Terraform automatically --
          # no -var flags needed. An empty string (no prior snapshot found)
          # is now handled correctly by main.tf's restore_from_snapshot check
          # (treats "" the same as null), rather than relying on a shell
          # ${VAR:-null} substitution that passed the literal text "null"
          # instead of an actual null value.
          #
          # Always uses the module's own vm_size default (Standard_F8s_v2) --
          # no per-run override.
          terraform apply -auto-approve

          echo "public_ip=$(terraform output -raw public_ip_address)" >> "$GITHUB_OUTPUT"
          echo "vm_id=$(terraform output -raw vm_id)" >> "$GITHUB_OUTPUT"

      # Resolves the VM target for every later step. Normal create: just
      # passes through Terraform apply's own outputs. Seed-only repair mode
      # (inputs.seed_config_only_vm_name set): looks the existing VM up
      # directly by name instead, so the config-seed steps below can target
      # it without provisioning/Terraform ever running.
      - name: Resolve VM target (provisioned or existing)
        id: target
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.seed_config_only_vm_name }}" ]; then
            RG="${{ vars.DEMO_RESOURCE_GROUP }}"
            VM_ID=$(az vm show -g "$RG" -n "${{ inputs.seed_config_only_vm_name }}" --query id -o tsv)
            PUBLIC_IP=$(az vm list-ip-addresses -g "$RG" -n "${{ inputs.seed_config_only_vm_name }}" \
              --query "[0].virtualMachine.network.publicIpAddresses[0].ipAddress" -o tsv)
            echo "Seed-only mode: targeting existing VM '${{ inputs.seed_config_only_vm_name }}' (no provisioning)."
          else
            VM_ID="${{ steps.apply.outputs.vm_id }}"
            PUBLIC_IP="${{ steps.apply.outputs.public_ip }}"
          fi
          echo "vm_id=${VM_ID}" >> "$GITHUB_OUTPUT"
          echo "public_ip=${PUBLIC_IP}" >> "$GITHUB_OUTPUT"

      - name: Deploy application stack to VM (az vm run-command, no SSH)
        id: deploy
        if: ${{ inputs.seed_config_only_vm_name == '' }}
        env:
          DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VM_ID="${{ steps.target.outputs.vm_id }}"

          # No SSH key or long-lived PAT is used here -- az vm run-command
          # executes over the Azure control plane via the VM agent,
          # authenticated by the caller's own Azure identity (this
          # workflow's OIDC login). The only credential passed to the VM is
          # this job's own short-lived GITHUB_TOKEN (expires when the job
          # ends), supplied as a run-command *parameter* (not interpolated
          # into the script text), so it never appears in command history
          # or Azure Activity Log entries for this operation.
          # az vm run-command only reports whether the Azure VM Agent
          # extension itself executed (displayStatus "Provisioning
          # succeeded") -- NOT whether the inner script actually ran to
          # completion (confirmed via a real failed run: on a freshly
          # bootstrapped VM, this script silently stopped right after
          # `cloud-init status --wait` with zero output afterward -- neither
          # "Login Succeeded" nor any docker/git output -- yet the extension
          # still reported success, and /opt/cloudmax never got created).
          # The DEPLOY_STACK_OK sentinel echoed as this script's last line
          # is the only reliable signal every command actually ran;
          # retrying works around the observed cold-boot timing flake
          # (confirmed: manually re-invoking the identical script right
          # after a "silent stop" succeeded on the very next attempt, no
          # code change needed).
          MAX_ATTEMPTS=3
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
          OUTPUT=$(az vm run-command invoke \
            --ids "$VM_ID" \
            --command-id RunShellScript \
            --parameters "${DEPLOY_TOKEN}" "${GITHUB_SHA}" "${{ vars.DEMO_KEY_VAULT_ID }}" \
            --scripts '
              # NOTE: this runs via az vm run-command RunShellScript, which
              # invokes /bin/sh -- Ubuntu defaults /bin/sh to dash, which
              # does not support "pipefail" (confirmed via a real run:
              # "script.sh: 4: set: Illegal option -o pipefail"). That
              # failure meant -e/-u never actually activated, silently
              # masking every subsequent command failure (missing docker,
              # missing az CLI) as a reported "success". Use the POSIX-
              # portable "set -eu" instead -- no pipe (|) in this script
              # depends on pipefail for correct failure detection.
              set -eu
              GITHUB_TOKEN_ARG="$1"
              COMMIT_SHA_ARG="$2"
              KEY_VAULT_ID_ARG="$3"

              # terraform apply only waits for the VM *resource* to report
              # provisioned -- the bootstrap cloud-init (installing docker,
              # docker-compose-v2, and the Azure CLI, see main.tf osProfile
              # customData) keeps running in the background after that and
              # can still be in progress here. Confirmed via a real failed
              # run: "az: not found" at this exact az login line, because
              # the Azure CLI install script had not finished yet.
              # cloud-init status --wait blocks until it is actually done
              # (no-ops immediately on a steady-state/snapshot-restored VM,
              # since cloud-init already completed on a prior boot and
              # carries that state over on the copied disk).
              cloud-init status --wait

              az login --identity

              # Fetch the exact commit that triggered this run -- not just
              # whatever is on main at deploy time -- using the short-lived
              # token above, then discard the clone directory credential.
              rm -rf /opt/cloudmax
              git clone --quiet "https://x-access-token:${GITHUB_TOKEN_ARG}@github.com/maplelabs/CloudMax.git" /opt/cloudmax
              cd /opt/cloudmax
              git checkout --quiet "${COMMIT_SHA_ARG}"

              ACR_NAME=$(echo "${{ vars.ACR_REGISTRY }}" | cut -d"." -f1)
              az acr login --name "$ACR_NAME"

              # Key Vault name is the last path segment of the resource ID.
              KV_NAME=$(basename "${KEY_VAULT_ID_ARG}")
              export POSTGRES_PASSWORD=$(az keyvault secret show --vault-name "$KV_NAME" --name postgres-password --query value -o tsv)
              export REDIS_QUEUE_AUTH=$(az keyvault secret show --vault-name "$KV_NAME" --name redis-queue-auth --query value -o tsv)
              export ACR_REGISTRY="${{ vars.ACR_REGISTRY }}"
              export IMAGE_NAMESPACE="${{ vars.IMAGE_NAMESPACE }}"
              export IMAGE_TAG="latest"

              docker compose -f docker-compose.prod.yml pull
              docker compose -f docker-compose.prod.yml up -d
              echo "DEPLOY_STACK_OK"
            ' 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "DEPLOY_STACK_OK"; then
            echo "Deploy application stack: confirmed complete on attempt ${attempt}."
            break
          fi
          if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
            echo "::error::Deploy application stack never reached its DEPLOY_STACK_OK sentinel after ${MAX_ATTEMPTS} attempts -- the script silently stopped partway (see output above)."
            exit 1
          fi
          echo "DEPLOY_STACK_OK sentinel not found (attempt ${attempt}/${MAX_ATTEMPTS}) -- retrying in 30s..."
          sleep 30
          done

      - name: Seed CloudMax primary LLM + embedding config
        id: seed_llm_config
        run: |
          set -euo pipefail
          VM_ID="${{ steps.target.outputs.vm_id }}"

          # CloudMax's primary LLM and embedding model connections live in
          # the same app_config DB table as the MCP connections seeded below
          # -- empty by default, which otherwise means configuring both by
          # hand through the Settings UI after every single demo deploy.
          #
          # Non-secret fields (provider, endpoint URLs, model/deployment IDs,
          # API version, price per 1k tokens) come from repo Variables. Both
          # API keys come from repo Secrets (LLM_API_KEY, EMBEDDING_API_KEY)
          # -- GitHub automatically masks these in all logs/output. Passed to
          # the VM as az vm run-command *parameters* (same mechanism already
          # used for GITHUB_TOKEN in the hotel-app deploy step below) --
          # never interpolated into the script text itself, so they never
          # appear in command history or Azure Activity Log entries for this
          # operation.
          #
          # The seed script itself (infra/cloudmax/scripts/seed_llm_config.py)
          # is already present on the VM from this repo's own git clone
          # (done in the deploy step above) -- no base64 re-embedding needed.
          #
          # IMPORTANT: Azure's RunCommand mechanism joins all --parameters
          # values with spaces and the VM-side shell re-splits on
          # whitespace -- this happens regardless of how carefully each
          # value is quoted on the az CLI side (confirmed via a real test:
          # a single parameter "Azure Anthropic" arrived on the VM as TWO
          # separate positional args, "Azure" and "Anthropic", silently
          # shifting every parameter after it by one position and causing
          # `export: 0.005: bad variable name` further down the script).
          # So every value below MUST be space-free. LLM_PROVIDER /
          # EMBEDDING_LLM_PROVIDER repo Variables may be human-friendly
          # ("Azure Anthropic") -- normalize them here (lowercase, spaces
          # to hyphens) before they ever reach --parameters. This also
          # conveniently produces exactly the slug values
          # (azure-anthropic / azure-openai) seed_llm_config.py's enum
          # validation expects. Price vars are also stripped of incidental
          # whitespace for the same reason.
          LLM_PROVIDER_SLUG=$(echo "${{ vars.LLM_PROVIDER }}" | tr '[:upper:]' '[:lower:]' | tr -s ' ' '-' | xargs)
          EMBEDDING_PROVIDER_SLUG=$(echo "${{ vars.EMBEDDING_LLM_PROVIDER }}" | tr '[:upper:]' '[:lower:]' | tr -s ' ' '-' | xargs)
          LLM_PRICE_IN=$(echo "${{ vars.LLM_PRICE_PER_1K_INPUT_TOKENS }}" | tr -d '[:space:]')
          LLM_PRICE_OUT=$(echo "${{ vars.LLM_PRICE_PER_1K_OUTPUT_TOKENS }}" | tr -d '[:space:]')

          for v in "${{ vars.LLM_ENDPOINT_URL }}" "${{ vars.LLM_MODEL_ID }}" "${{ vars.EMBEDDING_ENDPOINT_URL }}" "${{ vars.EMBEDDING_DEPLOYMENT_NAME }}" "${{ vars.EMBEDDING_API_VERSION }}"; do
            case "$v" in
              *" "*) echo "::error::Repo Variable value '$v' contains a space -- Azure RunCommand cannot pass this safely as a positional parameter. Remove the space from this Variable's value." && exit 1 ;;
            esac
          done

          az vm run-command invoke \
            --ids "$VM_ID" \
            --command-id RunShellScript \
            --parameters "${LLM_PROVIDER_SLUG}" "${{ vars.LLM_ENDPOINT_URL }}" "${{ vars.LLM_MODEL_ID }}" "${LLM_PRICE_IN}" "${LLM_PRICE_OUT}" "${EMBEDDING_PROVIDER_SLUG}" "${{ vars.EMBEDDING_ENDPOINT_URL }}" "${{ vars.EMBEDDING_DEPLOYMENT_NAME }}" "${{ vars.EMBEDDING_API_VERSION }}" "${{ secrets.LLM_API_KEY }}" "${{ secrets.EMBEDDING_API_KEY }}" \
            --scripts '
              set -eu
              LLM_PROVIDER_ARG="$1"
              LLM_ENDPOINT_URL_ARG="$2"
              LLM_MODEL_ID_ARG="$3"
              LLM_PRICE_IN_ARG="$4"
              LLM_PRICE_OUT_ARG="$5"
              EMBEDDING_LLM_PROVIDER_ARG="$6"
              EMBEDDING_ENDPOINT_URL_ARG="$7"
              EMBEDDING_DEPLOYMENT_NAME_ARG="$8"
              EMBEDDING_API_VERSION_ARG="$9"
              LLM_API_KEY_ARG="${10}"
              EMBEDDING_API_KEY_ARG="${11}"

              if ! docker ps --format "{{.Names}}" | grep -qx "cloudmax-backend"; then
                echo "::warning::cloudmax-backend container not found -- skipping LLM/embedding config seeding."
                exit 0
              fi

              if [ ! -f /opt/cloudmax/infra/cloudmax/scripts/seed_llm_config.py ]; then
                echo "::warning::seed_llm_config.py not found on VM -- skipping LLM/embedding config seeding."
                exit 0
              fi

              export LLM_PROVIDER="${LLM_PROVIDER_ARG}"
              export LLM_ENDPOINT_URL="${LLM_ENDPOINT_URL_ARG}"
              export LLM_MODEL_ID="${LLM_MODEL_ID_ARG}"
              export LLM_PRICE_PER_1K_INPUT_TOKENS="${LLM_PRICE_IN_ARG}"
              export LLM_PRICE_PER_1K_OUTPUT_TOKENS="${LLM_PRICE_OUT_ARG}"
              export EMBEDDING_LLM_PROVIDER="${EMBEDDING_LLM_PROVIDER_ARG}"
              export EMBEDDING_ENDPOINT_URL="${EMBEDDING_ENDPOINT_URL_ARG}"
              export EMBEDDING_DEPLOYMENT_NAME="${EMBEDDING_DEPLOYMENT_NAME_ARG}"
              export EMBEDDING_API_VERSION="${EMBEDDING_API_VERSION_ARG}"
              export LLM_API_KEY="${LLM_API_KEY_ARG}"
              export EMBEDDING_API_KEY="${EMBEDDING_API_KEY_ARG}"

              docker cp /opt/cloudmax/infra/cloudmax/scripts/seed_llm_config.py cloudmax-backend:/tmp/seed_llm_config.py
              docker exec \
                -e LLM_PROVIDER \
                -e LLM_API_KEY \
                -e EMBEDDING_API_KEY \
                -e LLM_ENDPOINT_URL \
                -e LLM_MODEL_ID \
                -e LLM_PRICE_PER_1K_INPUT_TOKENS \
                -e LLM_PRICE_PER_1K_OUTPUT_TOKENS \
                -e EMBEDDING_LLM_PROVIDER \
                -e EMBEDDING_ENDPOINT_URL \
                -e EMBEDDING_DEPLOYMENT_NAME \
                -e EMBEDDING_API_VERSION \
                cloudmax-backend python3 /tmp/seed_llm_config.py \
                && echo "CloudMax primary LLM + embedding config seeded." \
                || echo "::warning::Failed to seed CloudMax LLM/embedding config -- configure manually via CloudMax'\''s Settings UI."
              docker exec cloudmax-backend rm -f /tmp/seed_llm_config.py
            '


      - name: Deploy hotel-reservation-application (optional)
        id: deploy_hotel
        if: ${{ inputs.deploy_hotel_reservation_app && inputs.seed_config_only_vm_name == '' }}
        run: |
          set -euo pipefail
          VM_ID="${{ steps.target.outputs.vm_id }}"

          # No git clone of the private fault-injector repo on the VM at all
          # anymore -- its 7 custom-built services are pre-built and
          # published to ACR by image-build-push-hotel.yml, and the compose
          # file + its config/database-init/dashboard assets are vendored
          # into THIS repo under infra/hotel-app/ (already present in
          # /opt/cloudmax from the CloudMax deploy step above, same
          # checkout). This removes the need for the fault-injector-read-token
          # Key Vault secret entirely (previously fetched here on every demo
          # create -- see kv-bootstrap-secrets.yml's history).
          # Same "extension status != script exit code" blind spot as the
          # CloudMax deploy step above -- retry on a missing sentinel.
          MAX_ATTEMPTS=3
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
          OUTPUT=$(az vm run-command invoke \
            --ids "$VM_ID" \
            --command-id RunShellScript \
            --parameters "${{ vars.ACR_REGISTRY }}" "${{ vars.IMAGE_NAMESPACE }}" "latest" "${{ steps.target.outputs.public_ip }}" \
            --scripts '
              set -eu
              ACR_REGISTRY_ARG="$1"
              IMAGE_NAMESPACE_ARG="$2"
              HOTEL_IMAGE_TAG_ARG="$3"
              PUBLIC_IP_ARG="$4"
              if [ -z "${IMAGE_NAMESPACE_ARG}" ]; then
                IMAGE_NAMESPACE_ARG="cloudmax"
              fi

              if [ ! -d /opt/cloudmax/infra/hotel-app ]; then
                echo "ERROR: /opt/cloudmax/infra/hotel-app not found -- CloudMax deploy step has not completed on this VM yet." >&2
                exit 1
              fi

              az login --identity

              ACR_NAME=$(echo "${ACR_REGISTRY_ARG}" | cut -d"." -f1)
              az acr login --name "$ACR_NAME"

              cd /opt/cloudmax/infra/hotel-app

              export COMPOSE_PROJECT_NAME=hotel
              export ACR_REGISTRY="${ACR_REGISTRY_ARG}"
              export IMAGE_NAMESPACE="${IMAGE_NAMESPACE_ARG}"
              export HOTEL_IMAGE_TAG="${HOTEL_IMAGE_TAG_ARG}"
              export PUBLIC_IP="${PUBLIC_IP_ARG}"
              export TRACING_ENABLED="true"

              docker compose pull
              docker compose up -d

              # --- Bridge networking with the CloudMax stack -----------------
              # Both stacks are independent docker-compose projects, each with
              # its own private bridge network (cloudmax_cloudmax-network /
              # hotel_hotel_network). Neither compose file is edited to declare
              # an external/shared network, so neither repo takes on a
              # dependency on infrastructure owned by the other. Instead, every
              # already-running container from both stacks is additionally
              # attached to the OTHER stack network post-startup, with
              # --alias set to its own compose service name, so DNS-based
              # service discovery (e.g. http://hotel-grafana-mcp:8000,
              # http://cloudmax-mcp-server:8000) works symmetrically in both
              # directions.
              CLOUDMAX_NET="cloudmax_cloudmax-network"
              HOTEL_NET="hotel_hotel_network"

              for svc in $(docker compose ps --services); do
                CID=$(docker compose ps -q "$svc")
                if [ -n "$CID" ]; then
                  docker network connect --alias "$svc" "$CLOUDMAX_NET" "$CID" 2>/dev/null || true
                fi
              done

              for CNAME in cloudmax-backend cloudmax-mcp-server cloudmax-code-triage-agent cloudmax-frontend; do
                if docker ps --format "{{.Names}}" | grep -qx "$CNAME"; then
                  docker network connect --alias "$CNAME" "$HOTEL_NET" "$CNAME" 2>/dev/null || true
                fi
              done
              echo "DEPLOY_HOTEL_OK"
            ' 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "DEPLOY_HOTEL_OK"; then
            echo "Deploy hotel-reservation-application: confirmed complete on attempt ${attempt}."
            break
          fi
          if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
            echo "::error::Deploy hotel-reservation-application never reached its DEPLOY_HOTEL_OK sentinel after ${MAX_ATTEMPTS} attempts (see output above)."
            exit 1
          fi
          echo "DEPLOY_HOTEL_OK sentinel not found (attempt ${attempt}/${MAX_ATTEMPTS}) -- retrying in 30s..."
          sleep 30
          done

      - name: Deploy fault-injector platform (optional)
        id: deploy_fault_injector
        if: ${{ inputs.deploy_hotel_reservation_app && inputs.deploy_fault_injector && inputs.seed_config_only_vm_name == '' }}
        run: |
          set -euo pipefail
          VM_ID="${{ steps.target.outputs.vm_id }}"

          # Same no-PAT-on-the-VM posture as the hotel app deploy step above:
          # the 4 custom-built fault-injector-* images are pre-built and
          # published to ACR by image-build-push-hotel.yml. The Airflow DAG
          # generator, fault-engine Python modules, and fault/experiment JSON
          # definitions are vendored into infra/fault-injector/ in THIS repo
          # (already present in /opt/cloudmax from the CloudMax deploy step's
          # git clone) -- see that directory's docker-compose.yml header
          # comment for why these specifically cannot just be baked into a
          # custom image (Airflow's DockerOperator spawns sibling containers
          # on the HOST Docker daemon, bind-mounting them by HOST filesystem
          # path).
          # Same "extension status != script exit code" blind spot as the
          # CloudMax deploy step above -- retry on a missing sentinel.
          MAX_ATTEMPTS=3
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
          OUTPUT=$(az vm run-command invoke \
            --ids "$VM_ID" \
            --command-id RunShellScript \
            --parameters "${{ vars.ACR_REGISTRY }}" "${{ vars.IMAGE_NAMESPACE }}" "latest" \
            --scripts '
              set -eu
              ACR_REGISTRY_ARG="$1"
              IMAGE_NAMESPACE_ARG="$2"
              FAULT_INJECTOR_IMAGE_TAG_ARG="$3"
              if [ -z "${IMAGE_NAMESPACE_ARG}" ]; then
                IMAGE_NAMESPACE_ARG="cloudmax"
              fi

              if [ ! -d /opt/cloudmax/infra/fault-injector ]; then
                echo "ERROR: /opt/cloudmax/infra/fault-injector not found -- CloudMax deploy step has not completed on this VM yet." >&2
                exit 1
              fi

              az login --identity

              ACR_NAME=$(echo "${ACR_REGISTRY_ARG}" | cut -d"." -f1)
              az acr login --name "$ACR_NAME"

              cd /opt/cloudmax/infra/fault-injector

              export COMPOSE_PROJECT_NAME=faultinjector
              export ACR_REGISTRY="${ACR_REGISTRY_ARG}"
              export IMAGE_NAMESPACE="${IMAGE_NAMESPACE_ARG}"
              export FAULT_INJECTOR_IMAGE_TAG="${FAULT_INJECTOR_IMAGE_TAG_ARG}"

              # Builder.py (the Airflow DAG generator) spawns fault-execution
              # containers as HOST-network siblings via the Docker socket,
              # bind-mounting these two paths by HOST filesystem Source --
              # must be absolute, real paths on this VM, not container-
              # internal ones. /opt/cloudmax is this VMs real checkout of
              # THIS repo (see the CloudMax deploy step above), so these
              # vendored directories already exist there for free.
              export HOST_FAULTS_DIR=/opt/cloudmax/infra/fault-injector/faults
              export HOST_FAULT_ENGINE_DIR=/opt/cloudmax/infra/fault-injector/fault-engine

              docker compose pull custom-ui-backend custom-ui-frontend fault-notification fault-service
              docker compose up -d

              # --- Bridge fault-notification onto the CloudMax stack --------
              # Only fault-notification needs cross-stack reachability (it
              # POSTs ground-truth "this fault was injected" records to
              # cloudmax-backend:8000/v1/fault-ledger -- see
              # fault_ledger.json). Everything else in this stack only talks
              # to other containers within this same compose project, or
              # spawns host-network sibling containers via the Docker socket
              # (network_mode=host, no bridging needed). Same
              # docker-network-connect --alias pattern as the hotel app
              # bridging above, but one-directional and narrowly scoped.
              CLOUDMAX_NET="cloudmax_cloudmax-network"
              if docker ps --format "{{.Names}}" | grep -qx "fault-notification"; then
                docker network connect --alias fault-notification "$CLOUDMAX_NET" fault-notification 2>/dev/null || true
              fi
              echo "DEPLOY_FAULT_INJECTOR_OK"
            ' 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "DEPLOY_FAULT_INJECTOR_OK"; then
            echo "Deploy fault-injector platform: confirmed complete on attempt ${attempt}."
            break
          fi
          if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
            echo "::error::Deploy fault-injector platform never reached its DEPLOY_FAULT_INJECTOR_OK sentinel after ${MAX_ATTEMPTS} attempts (see output above)."
            exit 1
          fi
          echo "DEPLOY_FAULT_INJECTOR_OK sentinel not found (attempt ${attempt}/${MAX_ATTEMPTS}) -- retrying in 30s..."
          sleep 30
          done

      - name: Provision Grafana API key for grafana-mcp-server (optional)
        id: grafana_key
        if: ${{ inputs.deploy_hotel_reservation_app && inputs.seed_config_only_vm_name == '' }}
        run: |
          set -euo pipefail
          VM_ID="${{ steps.target.outputs.vm_id }}"

          # grafana-mcp-server needs a real Grafana service-account token to
          # actually work (GRAFANA_API_KEY defaults to an empty string in
          # infra/hotel-app/docker-compose.yml otherwise -- see that file's
          # header comment). A Grafana API token can only be minted by
          # calling Grafana's own HTTP API *after* Grafana itself is up
          # (chicken-and-egg: it is not a value that can be pre-generated
          # like postgres-password/redis-queue-auth), so this cannot be a
          # Key Vault bootstrap step -- it has to run post-deploy, here.
          #
          # Uses python3 for JSON parsing (not jq) -- jq is not in this VM's
          # cloud-init package list (main.tf), but python3 is guaranteed
          # present as a transitive dependency of the Azure CLI install,
          # which every prior step on this VM already depends on.
          az vm run-command invoke \
            --ids "$VM_ID" \
            --command-id RunShellScript \
            --parameters "${{ vars.ACR_REGISTRY }}" "${{ vars.IMAGE_NAMESPACE }}" "latest" "${{ steps.target.outputs.public_ip }}" \
            --scripts '
              set -eu
              ACR_REGISTRY_ARG="$1"
              IMAGE_NAMESPACE_ARG="$2"
              HOTEL_IMAGE_TAG_ARG="$3"
              PUBLIC_IP_ARG="$4"
              if [ -z "${IMAGE_NAMESPACE_ARG}" ]; then
                IMAGE_NAMESPACE_ARG="cloudmax"
              fi

              # Read the admin password Grafana is actually running with
              # (ground truth from the live container config), rather than
              # re-parsing docker-compose.yml -- avoids any drift if the
              # compose file default ever changes.
              ADMIN_PW=$(docker inspect hotel-grafana --format "{{range .Config.Env}}{{println .}}{{end}}" | grep "^GF_SECURITY_ADMIN_PASSWORD=" | cut -d= -f2-)
              if [ -z "$ADMIN_PW" ]; then
                echo "::warning::Could not read GF_SECURITY_ADMIN_PASSWORD from hotel-grafana container -- skipping Grafana API key provisioning."
                exit 0
              fi

              # Grafana itself can take longer to accept API calls than its
              # container to report "running" (first-boot DB migrations).
              READY=0
              for i in $(seq 1 30); do
                if curl -sf -u "admin:${ADMIN_PW}" http://localhost:3002/api/health >/dev/null 2>&1; then
                  READY=1
                  break
                fi
                sleep 5
              done
              if [ "$READY" != "1" ]; then
                echo "::warning::Grafana API never became ready -- skipping Grafana API key provisioning. grafana-mcp-server will run without a working GRAFANA_API_KEY."
                exit 0
              fi

              # Reuse the service account across demo redeploys on the same
              # VM (snapshot-restore case) instead of accumulating one per
              # run; only the token itself is always freshly minted, since
              # Grafana only ever reveals a token value once, at creation.
              SA_ID=$(curl -sf -u "admin:${ADMIN_PW}" "http://localhost:3002/api/serviceaccounts/search?query=cloudmax-mcp" \
                | python3 -c "import sys,json; accs=json.load(sys.stdin).get(\"serviceAccounts\",[]); print(accs[0][\"id\"] if accs else \"\")")

              if [ -z "$SA_ID" ]; then
                SA_ID=$(curl -sf -u "admin:${ADMIN_PW}" -X POST -H "Content-Type: application/json" \
                  -d "{\"name\":\"cloudmax-mcp\",\"role\":\"Admin\"}" \
                  http://localhost:3002/api/serviceaccounts \
                  | python3 -c "import sys,json; print(json.load(sys.stdin)[\"id\"])")
              fi

              TOKEN_NAME="mcp-token-$(date +%s)"
              GRAFANA_API_KEY=$(curl -sf -u "admin:${ADMIN_PW}" -X POST -H "Content-Type: application/json" \
                -d "{\"name\":\"${TOKEN_NAME}\"}" \
                "http://localhost:3002/api/serviceaccounts/${SA_ID}/tokens" \
                | python3 -c "import sys,json; print(json.load(sys.stdin)[\"key\"])")

              if [ -z "$GRAFANA_API_KEY" ]; then
                echo "::warning::Failed to mint a Grafana service-account token -- grafana-mcp-server will run without a working GRAFANA_API_KEY."
              else
              az login --identity
              ACR_NAME=$(echo "${ACR_REGISTRY_ARG}" | cut -d"." -f1)
              az acr login --name "$ACR_NAME"

              cd /opt/cloudmax/infra/hotel-app
              export COMPOSE_PROJECT_NAME=hotel
              export ACR_REGISTRY="${ACR_REGISTRY_ARG}"
              export IMAGE_NAMESPACE="${IMAGE_NAMESPACE_ARG}"
              export HOTEL_IMAGE_TAG="${HOTEL_IMAGE_TAG_ARG}"
              export PUBLIC_IP="${PUBLIC_IP_ARG}"
              export TRACING_ENABLED="true"
              export GRAFANA_API_KEY="$GRAFANA_API_KEY"

              # Only recreates grafana-mcp-server (the sole service whose
              # env actually changed) -- docker compose still needs the
              # full file + all referenced vars to interpolate correctly,
              # but it diffs each service'\''s resolved config against what is
              # already running and leaves everything else untouched.
              docker compose up -d grafana-mcp-server
              fi

              # Grafana alerting (contact point -> cloudmax-webhook,
              # notification policy, and the "Nginx HTTP 5xx Errors High"
              # alert rule in the "Hotel Reservation Alerts" folder) is now
              # file-provisioned directly from the repo -- see
              # infra/hotel-app/config/grafana/alerting/*.yml, mounted into
              # the grafana container at
              # /etc/grafana/provisioning/alerting. Grafana loads these on
              # every startup with no runtime API calls needed here
              # (previously this step made a series of curl/python3 calls
              # against Grafana'\''s provisioning HTTP API to create the same
              # objects -- removed in favor of the file-provisioned
              # version, which ships with the hotel app compose stack
              # instead of depending on this workflow).
            '

      - name: Seed CloudMax MCP connections for Grafana/Jaeger (optional)
        id: seed_mcp_config
        if: ${{ inputs.deploy_hotel_reservation_app }}
        run: |
          set -euo pipefail
          VM_ID="${{ steps.target.outputs.vm_id }}"
          VM_PUBLIC_IP="${{ steps.target.outputs.public_ip }}"

          # CloudMax's backend reads its MCP/observability-system connections
          # from the app_config DB table (CONFIG_DB=true in
          # docker-compose.prod.yml), not from env vars -- that table is
          # empty by default, so without this step CloudMax would never
          # discover Grafana/Jaeger on its own. Enabled by default here
          # (enabled: true) using the demo VM's own public IP on the
          # host-published MCP ports (grafana-mcp-server: 8012, jaeger-mcp-
          # server: 8011 -- see infra/hotel-app/docker-compose.yml), with
          # connection_type streamable-http (CloudMax's "HTTP streaming"
          # option), matching what a user actually reaches testing the
          # connection from the Settings UI.
          #
          # Runs the seed script INSIDE the cloudmax-backend container via
          # docker exec (checked into the repo at
          # infra/cloudmax/scripts/seed_mcp_config.py and already present on
          # the VM from this repo's own git clone, done in the deploy step
          # above -- no base64 re-embedding needed) so it reuses the app's
          # own SQLAlchemy models/enum values exactly as the running app
          # would -- no hand-written SQL, no enum-value guessing.
          az vm run-command invoke \
            --ids "$VM_ID" \
            --command-id RunShellScript \
            --parameters "${VM_PUBLIC_IP}" \
            --scripts '
              set -eu
              VM_PUBLIC_IP_ARG="$1"

              if ! docker ps --format "{{.Names}}" | grep -qx "cloudmax-backend"; then
                echo "::warning::cloudmax-backend container not found -- skipping MCP connection seeding."
                exit 0
              fi

              if [ ! -f /opt/cloudmax/infra/cloudmax/scripts/seed_mcp_config.py ]; then
                echo "::warning::seed_mcp_config.py not found on VM -- skipping MCP connection seeding."
                exit 0
              fi

              export VM_PUBLIC_IP="${VM_PUBLIC_IP_ARG}"
              docker cp /opt/cloudmax/infra/cloudmax/scripts/seed_mcp_config.py cloudmax-backend:/tmp/seed_mcp_config.py
              docker exec -e VM_PUBLIC_IP cloudmax-backend python3 /tmp/seed_mcp_config.py \
                && echo "CloudMax MCP connections seeded (grafana/jaeger)." \
                || echo "::warning::Failed to seed CloudMax MCP connections -- configure Grafana/Jaeger manually via CloudMax'\''s Settings UI."
              docker exec cloudmax-backend rm -f /tmp/seed_mcp_config.py
            '


              if ! docker ps --format "{{.Names}}" | grep -qx "cloudmax-backend"; then
                echo "::warning::cloudmax-backend container not found -- skipping MCP connection seeding."
                exit 0
              fi

              echo "$PAYLOAD_B64" | base64 -d > /tmp/seed_mcp_config.py
              docker cp /tmp/seed_mcp_config.py cloudmax-backend:/tmp/seed_mcp_config.py
              docker exec cloudmax-backend python3 /tmp/seed_mcp_config.py \
                && echo "CloudMax MCP connections seeded (grafana/jaeger)." \
                || echo "::warning::Failed to seed CloudMax MCP connections -- configure Grafana/Jaeger manually via CloudMax'\''s Settings UI."
              rm -f /tmp/seed_mcp_config.py
            '

      - name: Health check
        id: health
        if: ${{ inputs.seed_config_only_vm_name == '' }}
        run: |
          set -euo pipefail
          PUBLIC_IP="${{ steps.target.outputs.public_ip }}"
          ATTEMPTS=20
          SLEEP_SECONDS=15

          for i in $(seq 1 "$ATTEMPTS"); do
            if curl -fsS -m 10 "http://${PUBLIC_IP}/health" > /dev/null 2>&1 && \
               curl -fsSk -m 10 "https://${PUBLIC_IP}/health" > /dev/null 2>&1; then
              echo "Health check passed on attempt ${i}."
              exit 0
            fi
            echo "Health check attempt ${i}/${ATTEMPTS} failed, retrying in ${SLEEP_SECONDS}s..."
            sleep "$SLEEP_SECONDS"
          done

          echo "::error::Health check failed after ${ATTEMPTS} attempts. Demo environment is up but not confirmed healthy."
          exit 1

      - name: Report demo URL
        if: ${{ success() && inputs.seed_config_only_vm_name == '' }}
        run: |
          {
            echo "## Demo environment ready"
            echo ""
            echo "- **Demo name:** ${{ inputs.demo_name }}"
            echo "- **Requested by:** ${{ github.actor }}"
            echo "- **URL:** https://${{ steps.target.outputs.public_ip }}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ inputs.deploy_hotel_reservation_app }}" = "true" ]; then
            {
              echo ""
              echo "## fault-injector hotel-reservation-application"
              echo ""
              echo "- **URL:** http://${{ steps.target.outputs.public_ip }}:8090"
              echo "- Reachable from the CloudMax stack (and vice versa) by container name on both stacks' bridge networks, e.g. \`http://hotel-grafana-mcp:8000\`, \`http://hotel-jaeger-mcp:8000\` from CloudMax, or \`http://cloudmax-backend:8000\` from the hotel stack."
              echo "- Internal-only (not exposed via NSG): Grafana, Jaeger UI, Prometheus, Loki, and the rest of the observability stack -- inspect via \`az vm run-command\` on \`${{ steps.target.outputs.vm_id }}\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ inputs.deploy_hotel_reservation_app }}" = "true" ] && [ "${{ inputs.deploy_fault_injector }}" = "true" ]; then
            {
              echo ""
              echo "## fault-injector platform (Fault Gen UI)"
              echo ""
              echo "- **URL:** http://${{ steps.target.outputs.public_ip }}:4009"
              echo "- Use this to manually trigger faults against the hotel-reservation-application (Postgres write locks, Kafka schema mismatches, container restarts, memory stress, etc.). Each fault injection is reflected in Jaeger/Grafana, fires a Grafana alert into CloudMax for automated triage, and is separately ground-truth-recorded via cloudmax-backend's /v1/fault-ledger endpoint."
              echo "- Internal-only (not exposed via NSG): Airflow webserver, airflow-postgres, redis, custom-ui-backend (3009), fault-service (8010) -- inspect via \`az vm run-command\` on \`${{ steps.target.outputs.vm_id }}\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report seed-only completion
        if: ${{ success() && inputs.seed_config_only_vm_name != '' }}
        run: |
          {
            echo "## Config re-seed complete (no redeploy)"
            echo ""
            echo "- **VM:** ${{ inputs.seed_config_only_vm_name }}"
            echo "- **Public IP:** ${{ steps.target.outputs.public_ip }}"
            echo "- Re-applied: primary LLM + embedding config. MCP connections also re-applied if deploy_hotel_reservation_app was left true."
            echo "- No Terraform apply, no app redeploy -- verify the result in CloudMax's Settings UI."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Azure logout
        if: always()
        run: az logout || true
