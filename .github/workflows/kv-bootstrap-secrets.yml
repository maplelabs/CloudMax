# One-off bootstrap: populate the runtime secrets that docker-compose.prod.yml's
# containers and the demo-create.yml deploy steps need, but that nothing has
# created yet: postgres-password, redis-queue-auth (freshly generated, never
# pass through a workflow input), and optionally fault-injector-read-token
# (a read-only GitHub PAT for the private maplelabs/fault-injector repo,
# which CANNOT be auto-generated -- it has to come from a human).
#
# Uses CloudMaX-App-GitHub-Int's existing OIDC identity (already granted
# Key Vault Secrets Officer on cloudmax-kv) -- no new credentials needed on
# the Azure side.
#
# postgres-password / redis-queue-auth: generated fresh inside the runner
# with openssl and written directly to Key Vault -- the value never appears
# in a workflow input, log, or git history.
#
# fault-injector-read-token (optional input): unlike the two secrets above,
# this MUST be supplied by the caller -- there's no way to generate a valid
# GitHub PAT from inside the runner. KNOWN TRADE-OFF: pasting it into this
# workflow's "Run workflow" dispatch form means the value appears in that
# run's dispatch-input metadata (visible via the GitHub API/CLI to anyone
# with read access to this repo's Actions history), even though the job's
# own logs mask it (`::add-mask::`) and it is written to Key Vault via a
# file, never a command-line argument. Prefer setting this one secret
# directly via `az keyvault secret set` (Azure Portal/CLI) with your own
# Key Vault Secrets Officer role instead, if you have it -- this input only
# exists as a fallback for callers who don't.
#
# Manually triggered only -- this is a bootstrap/maintenance action, not
# part of the regular create/destroy demo lifecycle. Re-running is safe:
# existing secrets are left untouched unless `force_rotate` is explicitly
# set to true.

name: Bootstrap Key Vault Secrets

on:
  workflow_dispatch:
    inputs:
      force_rotate:
        description: "Overwrite existing secret values with freshly generated ones"
        type: boolean
        default: false
      fault_injector_read_token:
        description: "Optional: a read-only GitHub PAT for the private maplelabs/fault-injector repo, to set as the fault-injector-read-token secret. CAUTION: appears in this run's dispatch-input audit trail (not masked there, only in job logs) -- prefer setting this secret directly via az keyvault secret set if you have Key Vault Secrets Officer on cloudmax-kv."
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap-secrets:
    name: Populate demo runtime secrets
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fail fast if Key Vault is not configured
        if: ${{ vars.DEMO_KEY_VAULT_ID == '' }}
        run: |
          echo "::error::Repository variable DEMO_KEY_VAULT_ID is not set."
          exit 1

      - name: Set postgres-password and redis-queue-auth
        run: |
          set -euo pipefail
          KV_NAME="$(echo "${{ vars.DEMO_KEY_VAULT_ID }}" | awk -F'/' '{print $NF}')"
          FORCE_ROTATE="${{ inputs.force_rotate }}"

          for SECRET_NAME in postgres-password redis-queue-auth; do
            EXISTS="false"
            if az keyvault secret show --vault-name "$KV_NAME" --name "$SECRET_NAME" >/dev/null 2>&1; then
              EXISTS="true"
            fi

            if [ "$EXISTS" = "true" ] && [ "$FORCE_ROTATE" != "true" ]; then
              echo "Secret '$SECRET_NAME' already exists -- leaving it untouched (force_rotate not set)."
              continue
            fi

            VALUE="$(openssl rand -base64 32 | tr -d '/+=' | head -c 32)"
            az keyvault secret set --vault-name "$KV_NAME" --name "$SECRET_NAME" --value "$VALUE" --output none
            unset VALUE
            echo "Secret '$SECRET_NAME' set (existed before: ${EXISTS})."
          done

      - name: Set fault-injector-read-token (optional, caller-supplied)
        if: ${{ inputs.fault_injector_read_token != '' }}
        run: |
          set -euo pipefail
          # Mask first, before anything else touches this value, in case any
          # later command in this job accidentally echoes it.
          echo "::add-mask::${{ inputs.fault_injector_read_token }}"

          KV_NAME="$(echo "${{ vars.DEMO_KEY_VAULT_ID }}" | awk -F'/' '{print $NF}')"
          SECRET_NAME="fault-injector-read-token"
          FORCE_ROTATE="${{ inputs.force_rotate }}"

          EXISTS="false"
          if az keyvault secret show --vault-name "$KV_NAME" --name "$SECRET_NAME" >/dev/null 2>&1; then
            EXISTS="true"
          fi

          if [ "$EXISTS" = "true" ] && [ "$FORCE_ROTATE" != "true" ]; then
            echo "Secret '$SECRET_NAME' already exists -- leaving it untouched (force_rotate not set)."
            exit 0
          fi

          # Written via --file (a runner-local temp file), never --value, so
          # the token never appears as a process argument on the runner.
          TOKEN_FILE="$(mktemp)"
          trap 'rm -f "$TOKEN_FILE"' EXIT
          printf '%s' "${{ inputs.fault_injector_read_token }}" > "$TOKEN_FILE"
          az keyvault secret set --vault-name "$KV_NAME" --name "$SECRET_NAME" --file "$TOKEN_FILE" --output none
          echo "Secret '$SECRET_NAME' set (existed before: ${EXISTS})."

      - name: Azure logout
        if: always()
        run: az logout || true
