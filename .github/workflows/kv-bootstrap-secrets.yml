# One-off bootstrap: populate the two runtime secrets
# (postgres-password, redis-queue-auth) that docker-compose.prod.yml's
# postgres/redis containers and the backend/mcp-nginx services need, but
# that nothing has created yet.
#
# Uses CloudMaX-App-GitHub-Int's existing OIDC identity (already granted
# Key Vault Secrets Officer on cloudmax-kv) -- no new credentials, no
# secret value ever appears in a workflow input, log, or git history. Each
# value is generated fresh inside the runner with openssl and written
# directly to Key Vault; only non-secret metadata (secret name, whether it
# already existed) is echoed.
#
# Manually triggered only -- this is a bootstrap/maintenance action, not
# part of the regular create/destroy demo lifecycle. Re-running is safe:
# existing secrets are left untouched unless `force_rotate` is explicitly
# set to true.
#
# This workflow also doubles as the only sanctioned way to DELETE a stray
# Key Vault secret (e.g. the now-unused fault-injector-read-token, left
# over from an earlier design -- see DEMO hotel-app PR history), since no
# local/human Azure identity here has Key Vault Secrets Officer on
# cloudmax-kv, but CloudMaX-App-GitHub-Int's OIDC identity does. Set
# `delete_secret_name` to the secret to remove; this skips the
# postgres-password/redis-queue-auth bootstrap step entirely for that run
# (the two are mutually exclusive on purpose -- a delete run should only
# delete, not also silently (re)create the runtime secrets). Deletion also
# purges the secret immediately (soft-delete protection is enabled on this
# vault), so the name becomes immediately reusable and the value is not
# recoverable afterward -- intentional for a credential being retired.

name: Bootstrap Key Vault Secrets

on:
  workflow_dispatch:
    inputs:
      force_rotate:
        description: "Overwrite existing secret values with freshly generated ones"
        type: boolean
        default: false
      delete_secret_name:
        description: "If set, DELETE (and purge) this named secret from cloudmax-kv instead of bootstrapping postgres-password/redis-queue-auth. Leave blank for the normal bootstrap behavior."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap-secrets:
    name: Populate demo runtime secrets
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fail fast if Key Vault is not configured
        if: ${{ vars.DEMO_KEY_VAULT_ID == '' }}
        run: |
          echo "::error::Repository variable DEMO_KEY_VAULT_ID is not set."
          exit 1

      - name: Delete a stray secret (when delete_secret_name is set)
        if: ${{ inputs.delete_secret_name != '' }}
        run: |
          set -euo pipefail
          KV_NAME="$(echo "${{ vars.DEMO_KEY_VAULT_ID }}" | awk -F'/' '{print $NF}')"
          SECRET_NAME="${{ inputs.delete_secret_name }}"

          if ! az keyvault secret show --vault-name "$KV_NAME" --name "$SECRET_NAME" >/dev/null 2>&1; then
            echo "Secret '$SECRET_NAME' does not exist in '$KV_NAME' -- nothing to delete."
            exit 0
          fi

          az keyvault secret delete --vault-name "$KV_NAME" --name "$SECRET_NAME" --output none
          echo "Secret '$SECRET_NAME' deleted (soft-deleted)."

          # This vault has soft-delete protection enabled (confirmed via a
          # real attempted delete elsewhere in this project -- the warning
          # az prints on every `secret delete` call). Purge immediately so
          # the name is reusable right away and the value is not recoverable,
          # since this delete path is only ever used to retire a credential
          # on purpose.
          az keyvault secret purge --vault-name "$KV_NAME" --name "$SECRET_NAME" --output none
          echo "Secret '$SECRET_NAME' purged."

      - name: Set postgres-password and redis-queue-auth
        if: ${{ inputs.delete_secret_name == '' }}
        run: |
          set -euo pipefail
          KV_NAME="$(echo "${{ vars.DEMO_KEY_VAULT_ID }}" | awk -F'/' '{print $NF}')"
          FORCE_ROTATE="${{ inputs.force_rotate }}"

          for SECRET_NAME in postgres-password redis-queue-auth; do
            EXISTS="false"
            if az keyvault secret show --vault-name "$KV_NAME" --name "$SECRET_NAME" >/dev/null 2>&1; then
              EXISTS="true"
            fi

            if [ "$EXISTS" = "true" ] && [ "$FORCE_ROTATE" != "true" ]; then
              echo "Secret '$SECRET_NAME' already exists -- leaving it untouched (force_rotate not set)."
              continue
            fi

            VALUE="$(openssl rand -base64 32 | tr -d '/+=' | head -c 32)"
            az keyvault secret set --vault-name "$KV_NAME" --name "$SECRET_NAME" --value "$VALUE" --output none
            unset VALUE
            echo "Secret '$SECRET_NAME' set (existed before: ${EXISTS})."
          done

      - name: Azure logout
        if: always()
        run: az logout || true
